# basic nginx server config file for static react SPA
# /usr/share/nginx/html contains the built app

user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout  65;

  # Compression (gzip is built-in; brotli requires extra module)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain text/css application/json application/javascript
    application/x-javascript text/xml application/xml
    application/xml+rss image/svg+xml;

  server {
    listen 80;
    server_name _;

    # Simple health endpoint
    location = /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Serve hashed static assets with long, immutable caching
    # (adjust extensions if needed)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
      # If the file exists, serve it; if not, 404 (do NOT fall back to index.html)
      try_files $uri =404;

      # Cache aggressively; hashed filenames make this safe
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Service workers shouldn't be cached too long
    location = /service-worker.js {
      try_files $uri =404;
      add_header Cache-Control "no-cache";
    }

    # SPA history fallback — everything else to index.html
    location / {
      try_files $uri $uri/ /index.html;
      # Helpful security headers for HTML responses
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer-when-downgrade always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Optional: cap upload size if you need it
    # client_max_body_size 10m;

    # Optional logs (default paths)
    # access_log /var/log/nginx/access.log;
    # error_log  /var/log/nginx/error.log warn;
  }
}
